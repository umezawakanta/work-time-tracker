<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
    <!-- Background -->
    <circle cx="48" cy="48" r="45" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2"/>

    <!-- Brain Outline -->
    <g transform="translate(48, 48)">
        <!-- Main Brain Shape -->
        <path d="M-25,-20 C-35,-25 -40,-15 -40,0 C-40,15 -35,25 -25,25 
             L-10,25 C-5,25 0,20 0,15 L0,-15 C0,-20 -5,-25 -10,-25 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" opacity="0.95"/>

        <path d="M25,-20 C35,-25 40,-15 40,0 C40,15 35,25 25,25 
             L10,25 C5,25 0,20 0,15 L0,-15 C0,-20 5,-25 10,-25 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" opacity="0.95"/>

        <!-- Brain Folds -->
        <g stroke="#d1d5db" stroke-width="1" fill="none" opacity="0.8">
            <!-- Left hemisphere folds -->
            <path d="M-30,-10 Q-25,-5 -30,0 Q-25,5 -30,10"/>
            <path d="M-20,-15 Q-15,-10 -20,-5 Q-15,0 -20,5"/>
            <path d="M-10,-10 Q-8,-5 -10,0 Q-8,5 -10,10"/>

            <!-- Right hemisphere folds -->
            <path d="M30,-10 Q25,-5 30,0 Q25,5 30,10"/>
            <path d="M20,-15 Q15,-10 20,-5 Q15,0 20,5"/>
            <path d="M10,-10 Q8,-5 10,0 Q8,5 10,10"/>
        </g>

        <!-- Neural Activity Indicators -->
        <g fill="#8b5cf6" opacity="0.8">
            <!-- Left hemisphere activity -->
            <circle cx="-25" cy="-8" r="2"/>
            <circle cx="-15" cy="5" r="1.5"/>
            <circle cx="-30" cy="8" r="1"/>

            <!-- Right hemisphere activity -->
            <circle cx="25" cy="-8" r="2"/>
            <circle cx="15" cy="5" r="1.5"/>
            <circle cx="30" cy="8" r="1"/>

            <!-- Central activity -->
            <circle cx="0" cy="-5" r="1.5"/>
            <circle cx="0" cy="5" r="1"/>
        </g>

        <!-- Connecting Neural Pathways -->
        <g stroke="#a855f7" stroke-width="1.5" fill="none" opacity="0.6">
            <path d="M-15,-8 Q0,-12 15,-8"/>
            <path d="M-15,0 Q0,-2 15,0"/>
            <path d="M-15,8 Q0,12 15,8"/>
        </g>

        <!-- Assessment Symbols -->
        <g transform="translate(0, 30)">
            <!-- IQ Symbol -->
            <rect x="-20" y="-5" width="12" height="8" rx="2" fill="#fbbf24" opacity="0.9"/>
            <text x="-14" y="1" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ffffff" font-weight="bold">IQ</text>

            <!-- WEIS Symbol -->
            <rect x="-5" y="-5" width="15" height="8" rx="2" fill="#06b6d4" opacity="0.9"/>
            <text x="2.5" y="1" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#ffffff" font-weight="bold">WEIS</text>

            <!-- ADHD Symbol -->
            <rect x="12" y="-5" width="18" height="8" rx="2" fill="#ef4444" opacity="0.9"/>
            <text x="21" y="1" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#ffffff" font-weight="bold">ADHD</text>
        </g>
    </g>
</svg> 