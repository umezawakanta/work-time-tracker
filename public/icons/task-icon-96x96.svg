<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
    <!-- Background -->
    <circle cx="48" cy="48" r="45" fill="#10b981" stroke="#059669" stroke-width="2"/>

    <!-- Checklist Paper -->
    <rect x="20" y="15" width="56" height="66" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

    <!-- Paper Fold -->
    <path d="M70,15 L70,21 L76,21 Z" fill="#f3f4f6"/>

    <!-- Checklist Items -->
    <g stroke="#10b981" stroke-width="2" fill="none">
        <!-- Completed Task 1 -->
        <circle cx="28" cy="28" r="4" stroke="#10b981" fill="#10b981"/>
        <path d="M26,28 L28,30 L32,26" stroke="#ffffff" stroke-width="2"/>
        <line x1="36" y1="28" x2="65" y2="28" stroke="#6b7280" stroke-width="1"/>

        <!-- Completed Task 2 -->
        <circle cx="28" cy="40" r="4" stroke="#10b981" fill="#10b981"/>
        <path d="M26,40 L28,42 L32,38" stroke="#ffffff" stroke-width="2"/>
        <line x1="36" y1="40" x2="60" y2="40" stroke="#6b7280" stroke-width="1"/>

        <!-- Current Task -->
        <circle cx="28" cy="52" r="4" stroke="#f59e0b" fill="#fbbf24"/>
        <line x1="36" y1="52" x2="68" y2="52" stroke="#374151" stroke-width="2"/>

        <!-- Pending Task -->
        <circle cx="28" cy="64" r="4" stroke="#9ca3af" fill="none"/>
        <line x1="36" y1="64" x2="62" y2="64" stroke="#d1d5db" stroke-width="1"/>
    </g>

    <!-- Progress Indicator -->
    <g transform="translate(48, 80)">
        <circle cx="0" cy="0" r="8" fill="none" stroke="#e5e7eb" stroke-width="2"/>
        <path d="M 0,-8 A 8,8 0 0,1 5.66,-5.66" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
