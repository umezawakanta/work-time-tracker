<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
    <!-- Background -->
    <circle cx="48" cy="48" r="45" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>

    <!-- Emergency Cross -->
    <g transform="translate(48, 48)">
        <!-- Cross Arms -->
        <rect x="-4" y="-20" width="8" height="40" rx="2" fill="#ffffff"/>
        <rect x="-20" y="-4" width="40" height="8" rx="2" fill="#ffffff"/>

        <!-- Inner Highlight -->
        <rect x="-2" y="-18" width="4" height="36" rx="1" fill="#fef2f2" opacity="0.8"/>
        <rect x="-18" y="-2" width="36" height="4" rx="1" fill="#fef2f2" opacity="0.8"/>
    </g>

    <!-- Heart Rate Line (Vital Signs) -->
    <g transform="translate(48, 25)" stroke="#fbbf24" stroke-width="2" fill="none">
        <path d="M-30,0 L-25,0 L-22,-8 L-18,12 L-14,-15 L-10,0 L30,0" opacity="0.8"/>
    </g>

    <!-- Support Icons -->
    <g transform="translate(48, 48)">
        <!-- Breathing Support (Top Left) -->
        <g transform="translate(-25, -25)">
            <circle cx="0" cy="0" r="6" fill="#06b6d4" opacity="0.8"/>
            <circle cx="0" cy="0" r="3" fill="#ffffff"/>
            <circle cx="0" cy="0" r="2" fill="#06b6d4"/>
        </g>

        <!-- Mind Support (Top Right) -->
        <g transform="translate(25, -25)">
            <circle cx="0" cy="0" r="6" fill="#8b5cf6" opacity="0.8"/>
            <path d="M-3,-2 C-3,-4 -1,-4 0,-2 C1,-4 3,-4 3,-2 C3,0 0,3 0,3 C0,3 -3,0 -3,-2 Z" fill="#ffffff"/>
        </g>

        <!-- Emergency Contact (Bottom Left) -->
        <g transform="translate(-25, 25)">
            <circle cx="0" cy="0" r="6" fill="#10b981" opacity="0.8"/>
            <rect x="-2" y="-3" width="4" height="6" rx="1" fill="#ffffff"/>
            <rect x="-1" y="-2" width="2" height="1" fill="#10b981"/>
        </g>

        <!-- Crisis Support (Bottom Right) -->
        <g transform="translate(25, 25)">
            <circle cx="0" cy="0" r="6" fill="#f59e0b" opacity="0.8"/>
            <circle cx="0" cy="-1" r="1" fill="#ffffff"/>
            <rect x="-0.5" y="0" width="1" height="3" fill="#ffffff"/>
        </g>
    </g>

    <!-- ADHD Crisis Text -->
    <g transform="translate(48, 75)">
        <rect x="-25" y="-4" width="50" height="8" rx="4" fill="#1f2937" opacity="0.9"/>
        <text x="0" y="1" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" font-weight="bold">ADHD危機対応</text>
    </g>

    <!-- Pulse Effect (Animation indicator) -->
    <circle cx="48" cy="48" r="50" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
</svg> 