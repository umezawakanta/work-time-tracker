<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
    <!-- Background Circle -->
    <circle cx="16" cy="16" r="15" fill="#8b5cf6" stroke="#7c3aed" stroke-width="1"/>

    <!-- Simplified Brain Shape -->
    <g transform="translate(16, 16)">
        <!-- Left Brain Hemisphere -->
        <path d="M-8,-6 C-12,-8 -14,-4 -14,0 C-14,4 -12,8 -8,8 
             L-3,8 C-1,8 0,6 0,4 L0,-4 C0,-6 -1,-8 -3,-8 Z" fill="#ffffff" opacity="0.95"/>

        <!-- Right Brain Hemisphere -->
        <path d="M8,-6 C12,-8 14,-4 14,0 C14,4 12,8 8,8 
             L3,8 C1,8 0,6 0,4 L0,-4 C0,-6 1,-8 3,-8 Z" fill="#ffffff" opacity="0.95"/>

        <!-- Simple Brain Folds -->
        <g stroke="#d1d5db" stroke-width="0.5" fill="none" opacity="0.6">
            <path d="M-10,-2 Q-8,0 -10,2"/>
            <path d="M-6,-3 Q-5,-1 -6,1"/>
            <path d="M10,-2 Q8,0 10,2"/>
            <path d="M6,-3 Q5,-1 6,1"/>
        </g>

        <!-- Neural Activity Points -->
        <g fill="#a855f7" opacity="0.8">
            <circle cx="-8" cy="-2" r="0.8"/>
            <circle cx="8" cy="-2" r="0.8"/>
            <circle cx="0" cy="1" r="0.6"/>
        </g>

        <!-- Central Connection -->
        <path d="M-4,-2 Q0,-3 4,-2" stroke="#a855f7" stroke-width="1" fill="none" opacity="0.6"/>
    </g>
</svg> 