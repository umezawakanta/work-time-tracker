<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アイコン生成</title>
</head>
<body>
    <h1>PWAアイコン生成</h1>
    <p>以下のキャンバスでアイコンを生成し、右クリックで保存してください。</p>
    
    <div id="canvas-container"></div>
    
    <script>
        // 必要なサイズ
        const sizes = [120, 152, 180, 192, 512];
        
        // SVGアイコンの内容
        const svgContent = `<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <!-- 背景 -->
          <rect width="512" height="512" fill="#3b82f6" rx="80"/>
          
          <!-- キャラクターの頭（黄色） -->
          <circle cx="256" cy="200" r="80" fill="#fbbf24" stroke="#1f2937" stroke-width="4"/>
          
          <!-- 目（黒い円形） -->
          <circle cx="240" cy="180" r="6" fill="#1f2937"/>
          <circle cx="272" cy="180" r="6" fill="#1f2937"/>
          
          <!-- 目のハイライト（白い点） -->
          <circle cx="242" cy="177" r="1.5" fill="#ffffff"/>
          <circle cx="274" cy="177" r="1.5" fill="#ffffff"/>
          
          <!-- 口（横長の楕円形） -->
          <ellipse cx="256" cy="220" rx="15" ry="6" fill="#1f2937"/>
          
          <!-- 胴体（緑色） -->
          <ellipse cx="256" cy="320" rx="70" ry="60" fill="#22c55e" stroke="#1f2937" stroke-width="4"/>
          
          <!-- アクセント（小さな装飾） -->
          <circle cx="150" cy="150" r="8" fill="#fbbf24" opacity="0.7"/>
          <circle cx="362" cy="150" r="6" fill="#fbbf24" opacity="0.7"/>
          <circle cx="120" cy="250" r="5" fill="#fbbf24" opacity="0.5"/>
          <circle cx="392" cy="250" r="7" fill="#fbbf24" opacity="0.5"/>
        </svg>`;
        
        // 各サイズのキャンバスを生成
        sizes.forEach(size => {
            const container = document.getElementById('canvas-container');
            
            // タイトル
            const title = document.createElement('h3');
            title.textContent = `${size}x${size} アイコン`;
            container.appendChild(title);
            
            // キャンバス
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            canvas.style.border = '1px solid #ccc';
            canvas.style.margin = '10px';
            container.appendChild(canvas);
            
            const ctx = canvas.getContext('2d');
            
            // SVGを画像として描画
            const img = new Image();
            const svgBlob = new Blob([svgContent], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(svgBlob);
            
            img.onload = function() {
                ctx.drawImage(img, 0, 0, size, size);
                URL.revokeObjectURL(url);
            };
            
            img.src = url;
            
            // ダウンロードボタン
            const button = document.createElement('button');
            button.textContent = `ダウンロード (${size}x${size})`;
            button.style.margin = '5px';
            button.onclick = function() {
                const link = document.createElement('a');
                link.download = `icon-${size}x${size}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
            container.appendChild(button);
            
            // 改行
            container.appendChild(document.createElement('br'));
        });
    </script>
</body>
</html>
