name: CI
on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      PNPM_VERSION: 10.4.1
      NODE_VERSION: 20
    steps:
      - uses: actions/checkout@v4

      # Node は package.json の engines に合わせて 20
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # pnpm を Corepack で有効化（この順序が重要）
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm -v

      # ★ pnpm の store を "必ず" 書き込み可能な一時領域へ固定
      - name: Configure writable pnpm store
        run: |
          mkdir -p "$RUNNER_TEMP/pnpm-store"
          # 1) プロジェクト .npmrc（最優先で効く）
          echo "store-dir=$RUNNER_TEMP/pnpm-store" >> .npmrc
          # 2) ローカル設定
          pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
          # 3) グローバル設定（保険）
          pnpm config set store-dir "$RUNNER_TEMP/pnpm-store" --global
          pnpm store path

      # 依存インストール（CLI でも直指定して三重固定）
      - name: Install deps
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/pnpm-store"

      # Lint（新規コードのみ厳格の lint:ci を使用）
      - name: Lint
        run: pnpm run lint:ci

      # 型チェック
      - name: Type check
        run: pnpm run type-check

      # ユニットテスト
      - name: Test (CI)
        run: pnpm run test:ci
