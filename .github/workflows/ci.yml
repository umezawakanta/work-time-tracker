name: CI
on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      PNPM_VERSION: 10.4.1
      NODE_VERSION: 20
    steps:
      - uses: actions/checkout@v4

      # Node は package.json の engines に合わせて 20
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # pnpm を Corepack で有効化（この順序が重要）
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm -v

      # pnpm store を書き込み可能な一時領域に固定（超重要）
      - name: Configure writable pnpm store
        run: |
          mkdir -p "$RUNNER_TEMP/pnpm-store"
          # グローバル設定としても固定
          pnpm config set store-dir "$RUNNER_TEMP/pnpm-store" --global
          # 念のため、このリポにローカル .npmrc も置く（最優先で効く）
          echo "store-dir=$RUNNER_TEMP/pnpm-store" >> .npmrc
          pnpm store path
        env:
          # 環境変数経由でも固定（保険）
          NPM_CONFIG_STORE_DIR: ${{ runner.temp }}/pnpm-store

      # 依存インストール（store-dir を明示して"二重固定"）
      - name: Install deps
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/pnpm-store"
        env:
          NPM_CONFIG_STORE_DIR: ${{ runner.temp }}/pnpm-store

      # Lint（新規コードのみ厳格の lint:ci を使用）
      - name: Lint
        run: pnpm run lint:ci

      # 型チェック
      - name: Type check
        run: pnpm run type-check

      # ユニットテスト
      - name: Test (CI)
        run: pnpm run test:ci
