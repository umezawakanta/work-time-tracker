name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Setup pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
      - name: Configure pnpm store (writable)
        run: |
          mkdir -p "$RUNNER_TEMP/pnpm-store"
          pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
          echo "PNPM_STORE_PATH=$RUNNER_TEMP/pnpm-store" >> $GITHUB_ENV
          pnpm store path
      - name: Run release-please (with PAT fallback)
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          release-type: node
          changelog-host: https://github.com
