name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        id: release
        uses: google-github-actions/release-please-action@v4
        with:
          release-type: node
          package-name: work-time-tracker
          changelog-types: |
            [{"type":"feat","section":"機能追加","hidden":false},
             {"type":"fix","section":"修正","hidden":false},
             {"type":"perf","section":"パフォーマンス","hidden":false},
             {"type":"refactor","section":"リファクタリング","hidden":false},
             {"type":"docs","section":"ドキュメント","hidden":false}]
