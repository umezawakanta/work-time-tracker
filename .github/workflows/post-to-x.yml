name: post-to-x-on-release

on:
  release:
    types: [published]

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Configure pnpm store (writable)
        run: |
          mkdir -p "$RUNNER_TEMP/pnpm-store"
          pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
          echo "PNPM_STORE_PATH=$RUNNER_TEMP/pnpm-store" >> $GITHUB_ENV
          pnpm store path
      - run: pnpm add -D twitter-api-v2 --store-dir "$RUNNER_TEMP/pnpm-store"
      - name: Build release note message (JA)
        id: msg
        run: |
          node -e "const fs=require('fs'); const tag=process.env.GITHUB_REF?.split('/').pop()||''; const cl=JSON.parse(fs.readFileSync('public/changelog.json','utf8')); const entry=cl.entries.find(e=>('v'+e.version)===tag||e.version===tag)||cl.entries[0]; const title='Work Time Tracker '+(tag||('v'+entry.version))+' を公開しました'; let notes=(entry?.notes||'').trim(); if(notes.length>260) notes=notes.slice(0,257)+'...'; const url='https://work-time-tracker-5d9q.vercel.app'; const out=title+'\n\n'+notes+'\n\n'+url+'\n#お知らせ #アップデート'; console.log(out); fs.writeFileSync('tweet.txt', out);"
      - name: Post to X
        env:
          X_APP_KEY: ${{ secrets.X_APP_KEY }}
          X_APP_SECRET: ${{ secrets.X_APP_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          node -e "const fs=require('fs'); const {TwitterApi}=require('twitter-api-v2'); const client=new TwitterApi({appKey:process.env.X_APP_KEY, appSecret:process.env.X_APP_SECRET, accessToken:process.env.X_ACCESS_TOKEN, accessSecret:process.env.X_ACCESS_SECRET}); const text=fs.readFileSync('tweet.txt','utf8'); client.v2.tweet(text).then(()=>console.log('tweeted')).catch(e=>{console.error(e); process.exit(1);});"
