name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Configure pnpm store (writable)
        run: |
          mkdir -p "$RUNNER_TEMP/pnpm-store"
          pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
          echo "NPM_CONFIG_STORE_DIR=$RUNNER_TEMP/pnpm-store" >> $GITHUB_ENV
          echo "PNPM_STORE_PATH=$RUNNER_TEMP/pnpm-store" >> $GITHUB_ENV
          pnpm store path

      # no-op (pnpm is ready at this point)

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          PNPM_HOME: ${{ env.PNPM_HOME }}
          PNPM_STORE_PATH: ${{ env.PNPM_STORE_PATH }}

      - name: Run unit tests with coverage (non-blocking)
        run: pnpm test -- --coverage --watchAll=false --passWithNoTests || true

      - name: Install Cypress binary
        run: pnpm exec cypress install || true

      - name: Run E2E JSON summary (non-blocking)
        run: |
          pnpm run preview -- --port 4173 & npx wait-on http://localhost:4173
          npx cypress run --reporter json --reporter-options "output=cypress/results/summary.json" || true

      - name: Generate Dev Status and publish coverage
        run: |
          pnpm run build:dev-status || true
          pnpm run build:dev-status:history || true

      - name: Build
        run: pnpm run vercel-build

      - name: Deploy to Vercel (Preview/Prod)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: .
          vercel-args: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Comment deploy URL on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          header: preview-deploy
          message: |
            ✅ Preview deployed via Vercel.
            - Branch: `${{ github.head_ref }}`
            - Commit: `${{ github.sha }}`
            - Visit the Vercel dashboard for the deployment URL.
