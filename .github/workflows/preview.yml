name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Configure pnpm store (writable)
        run: |
          mkdir -p "$RUNNER_TEMP/pnpm-store"
          pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
          echo "NPM_CONFIG_STORE_DIR=$RUNNER_TEMP/pnpm-store" >> $GITHUB_ENV
          echo "PNPM_STORE_PATH=$RUNNER_TEMP/pnpm-store" >> $GITHUB_ENV
          pnpm store path

      # no-op (pnpm is ready at this point)

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run vercel-build

      - name: Deploy to Vercel (Preview/Prod)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: .
          vercel-args: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Comment deploy URL on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          header: preview-deploy
          message: |
            ✅ Preview deployed via Vercel.
            - Branch: `${{ github.head_ref }}`
            - Commit: `${{ github.sha }}`
            - Visit the Vercel dashboard for the deployment URL.
